<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Заявка – Bootstrap Shop</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/custom.css">
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="index.html">Bootstrap Shop</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNavbar">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Главная</a></li>
          <li class="nav-item"><a class="nav-link" href="catalog.html">Каталог</a></li>
          <li class="nav-item"><a class="nav-link" href="product.html">Товар</a></li>
          <li class="nav-item"><a class="nav-link active" href="order.html">Заявка</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container my-5">
    <div class="row justify-content-center">
      <div class="col-12 col-lg-8">
        <h1 class="h2 mb-4">Оформление заявки</h1>

        <div class="alert alert-info" role="alert">
          Заполните форму — мы свяжемся с вами для уточнения деталей.
        </div>

        <form class="card shadow-sm p-4" novalidate>
          <div class="mb-3">
            <label for="name" class="form-label">Имя *</label>
            <input type="text" class="form-control" id="name" name="name" required minlength="2">
          </div>

          <div class="mb-3">
            <label for="email" class="form-label">E-mail *</label>
            <input type="email" class="form-control" id="email" name="email" required>
          </div>

          <div class="mb-3">
            <label for="phone" class="form-label">Телефон</label>
            <div class="input-group">
              <span class="input-group-text">+7</span>
              <input type="tel" class="form-control" id="phone" name="phone" placeholder="900 000-00-00">
            </div>
          </div>

          <div class="mb-3">
            <label for="topic" class="form-label">Тема заявки *</label>
            <select class="form-select" id="topic" name="topic" required>
              <option value="">Выберите тему</option>
              <option value="product">Заказ товара</option>
              <option value="consultation">Консультация</option>
              <option value="delivery">Доставка</option>
            </select>
          </div>

          <div class="mb-3">
            <label for="comment" class="form-label">Комментарий</label>
            <textarea class="form-control" id="comment" name="comment" rows="3"></textarea>
          </div>

          <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" id="agree" name="agree" required>
            <label class="form-check-label" for="agree">Согласен на обработку данных *</label>
          </div>

          <button type="submit" class="btn btn-primary">Отправить заявку</button>
        </form>
      </div>
    </div>
  </main>

  <footer class="bg-dark text-white py-4 mt-5">
    <div class="container text-center">
      <p class="mb-0">&copy; 2026 Bootstrap Shop. Учебный проект.</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
